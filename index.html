<!doctype html>
<html class="no-js" lang="no">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mari Dahl Benum &amp; Daniel Jakobsen</title>
  <meta name="description" content="Mobilvennlig bryllupsinvitasjon til Mari Dahl Benum og Daniel Jakobsen i Farsund 2.-4. juli 2027.">
  <link rel="stylesheet" href="css/style.css?v=20260510-112">
</head>

<body>
  <div class="page-shell">
    <div class="invitation-shell" data-invitation-shell>
      <div class="delivery-sequence" data-delivery-sequence aria-hidden="true">
        <div class="delivery__envelope" data-delivery-envelope>
          <div class="delivery__tap-prompt" data-delivery-tap-prompt>Trykk for å åpne</div>
          <div class="delivery__paper" data-delivery-paper></div>
          <div class="delivery__body"></div>
          <div class="delivery__front"></div>
          <div class="delivery__flap"></div>
          <span class="delivery__flap-seal" aria-hidden="true"></span>
        </div>
      </div>
      <div class="delivery__bg-reveal" data-delivery-bg-reveal aria-hidden="true"></div>

      <main class="invitation" id="invitation-content" data-invitation-content>

        <header class="tl-header" aria-label="Tittel">
          <div class="tl-header__visual">
            <div class="tl-header__portrait-wrap" aria-hidden="true">
              <img class="tl-header__portrait" src="img/couple-header-5.png" alt="" aria-hidden="true">
            </div>
            <div class="tl-header__copy">
              <h1 class="tl-header__title">Vi gifter oss!</h1>
              <p class="tl-header__sub tl-header__sub--title">Om <strong data-countdown>441</strong> dager</p>
            </div>
          </div>
        </header>

        <div class="tl-header-spacer" aria-hidden="true"></div>

        <div class="timeline" aria-label="Program og praktisk info" data-tl-container>
          <div class="timeline__line" aria-hidden="true"></div>

          <div class="timeline__stop timeline__stop--left" data-tl-stop data-tl-open data-tl-first>
            <div class="timeline__marker" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label">Mai 2026</span>
              <p class="timeline__heading">Du er invitert</p>
            </div>
          </div>

          <div class="timeline__stop timeline__stop--right timeline__stop--rsvp" data-tl-stop data-tl-open>
            <div class="timeline__marker" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label timeline__label--deadline"><span class="timeline__deadline-chip">Frist</span><span class="timeline__deadline-date">1. JULI 2026</span></span>
              <p class="timeline__heading">Send RSVP</p>
            </div>
          </div>

          <div class="timeline__stop timeline__stop--left" data-tl-stop data-tl-open>
            <div class="timeline__marker" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label timeline__label--deadline"><span class="timeline__deadline-chip">Frist</span><span class="timeline__deadline-date">31. JAN 2027</span></span>
              <p class="timeline__heading">Bestill overnatting</p>
            </div>
          </div>

          <div class="timeline__stop timeline__stop--right" data-tl-stop data-tl-open>
            <div class="timeline__marker" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label">Fredag 2. juli 2027</span>
              <p class="timeline__heading">Velkommen</p>
            </div>
          </div>

          <div class="timeline__stop timeline__stop--left timeline__stop--main" data-tl-stop data-tl-open>
            <div class="timeline__marker timeline__marker--main" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label">Lørdag 3. juli 2027</span>
              <p class="timeline__heading">Bryllupsdagen</p>
            </div>
          </div>

          <div class="timeline__stop timeline__stop--right" data-tl-stop data-tl-open>
            <div class="timeline__marker" aria-hidden="true"></div>
            <div class="timeline__body">
              <span class="timeline__label">Søndag 4. juli 2027</span>
              <p class="timeline__heading">På gjensyn</p>
            </div>
          </div>

        </div>

      </main>
    </div>

    <div class="invitation-texture-overlay" aria-hidden="true"></div>
  </div>

  <section class="tl-modal" data-tl-modal hidden aria-hidden="true">
    <div class="tl-modal__backdrop" data-tl-close></div>
    <div class="tl-modal__panel" role="dialog" aria-modal="true" aria-labelledby="tl-modal-title">
      <button class="tl-modal__close" type="button" data-tl-close aria-label="Lukk detaljvindu">×</button>
      <h2 class="tl-modal__title" id="tl-modal-title" data-tl-modal-title></h2>
      <p class="tl-modal__content">Placeholder</p>
    </div>
  </section>

  <script src="js/app.js?v=20260510-122"></script>
</body>

</html>
